global:
  resolve_timeout: 5m

route:
  receiver: "ntfy"
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  group_by: ["alertname", "severity", "instance"]

receivers:
  - name: "ntfy"
    webhook_configs:
      - url: "https://ntfy.tuxito.be/homelab-alerts"
        send_resolved: true

templates: []
