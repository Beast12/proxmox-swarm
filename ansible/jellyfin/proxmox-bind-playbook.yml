---
- name: Configure Proxmox host mounts and LXC bind mounts for Jellyfin
  hosts: proxmox_jellyfin_host
  become: true
  gather_facts: true

  vars:
    jellyfin_lxc_vmid: 107

    jellyfin_host_nfs_mounts:
      - src: "192.168.10.10:/volume1/proxmox_swarm_data"
        path: "/mnt/proxmox_swarm_data"
      - src: "192.168.10.9:/volume1/Movies"
        path: "/mnt/nfs/media-nas/movies"
      - src: "192.168.10.9:/volume1/Series"
        path: "/mnt/nfs/media-nas/tv"
      - src: "192.168.10.9:/volume1/Music"
        path: "/mnt/nfs/media-nas/music"
      - src: "192.168.10.9:/volume1/Cartoons"
        path: "/mnt/nfs/media-nas/cartoons"
      - src: "192.168.10.9:/volume1/Comedy"
        path: "/mnt/nfs/media-nas/comedy"
      - src: "192.168.10.9:/volume1/Audiobooks"
        path: "/mnt/nfs/media-nas/audiobooks"
      - src: "192.168.10.9:/volume1/Comics"
        path: "/mnt/nfs/media-nas/comics"

    jellyfin_lxc_bind_mounts:
      - id: 0
        source: "/mnt/proxmox_swarm_data/jellyfin"
        target: "/mnt/proxmox_swarm_data/jellyfin"
        read_only: false
      - id: 1
        source: "/mnt/nfs/media-nas/movies"
        target: "/mnt/nfs/media-nas/movies"
        read_only: true
      - id: 2
        source: "/mnt/nfs/media-nas/tv"
        target: "/mnt/nfs/media-nas/tv"
        read_only: true
      - id: 3
        source: "/mnt/nfs/media-nas/music"
        target: "/mnt/nfs/media-nas/music"
        read_only: true
      - id: 4
        source: "/mnt/nfs/media-nas/cartoons"
        target: "/mnt/nfs/media-nas/cartoons"
        read_only: true
      - id: 5
        source: "/mnt/nfs/media-nas/comedy"
        target: "/mnt/nfs/media-nas/comedy"
        read_only: true
      - id: 6
        source: "/mnt/nfs/media-nas/audiobooks"
        target: "/mnt/nfs/media-nas/audiobooks"
        read_only: true
      - id: 7
        source: "/mnt/nfs/media-nas/comics"
        target: "/mnt/nfs/media-nas/comics"
        read_only: true

  tasks:
    - name: Install NFS client tools on Proxmox host
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: yes

    - name: Ensure host mount directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "0755"
      loop: "{{ jellyfin_host_nfs_mounts }}"

    - name: Ensure NFS fstab entries are present on Proxmox host
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^{{ item.src | regex_escape }}\\s+{{ item.path | regex_escape }}\\s+nfs\\s"
        line: "{{ item.src }} {{ item.path }} nfs defaults,nfsvers=3,rw,_netdev,nofail,x-systemd.automount,x-systemd.idle-timeout=600,x-systemd.device-timeout=30s 0 0"
        state: present
      loop: "{{ jellyfin_host_nfs_mounts }}"

    - name: Reload systemd and mount NFS entries
      ansible.builtin.shell: |
        set -euo pipefail
        systemctl daemon-reload
        mount -a
      args:
        executable: /bin/bash

    - name: Check Jellyfin LXC exists
      ansible.builtin.command: "pct status {{ jellyfin_lxc_vmid }}"
      changed_when: false

    - name: Apply LXC bind mounts
      ansible.builtin.command: >-
        pct set {{ jellyfin_lxc_vmid }}
        -mp{{ item.id }}
        {{ item.source }},mp={{ item.target }}{{ ',ro=1' if item.read_only else '' }}
      loop: "{{ jellyfin_lxc_bind_mounts }}"

    - name: Restart Jellyfin LXC to apply mount updates
      ansible.builtin.shell: |
        set -euo pipefail
        if pct status {{ jellyfin_lxc_vmid }} | grep -q running; then
          pct reboot {{ jellyfin_lxc_vmid }}
        else
          pct start {{ jellyfin_lxc_vmid }}
        fi
      args:
        executable: /bin/bash
