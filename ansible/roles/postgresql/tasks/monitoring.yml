---
# Manage Prometheus exporter user via TCP connection

- name: Ensure exporter password is set
  ansible.builtin.fail:
    msg: "postgresql_exporter_password must be set when postgresql_enable_exporter_user is true"
  when: postgresql_exporter_password | default('') == ''

- name: Ensure Prometheus exporter user exists
  community.postgresql.postgresql_user:
    name: "{{ postgresql_exporter_user }}"
    password: "{{ postgresql_exporter_password }}"
    role_attr_flags: LOGIN
    state: present
    login_host: "{{ postgresql_host }}"
    login_port: "{{ postgresql_port }}"
    login_user: "{{ postgresql_admin_user }}"
    login_password: "{{ postgresql_admin_password }}"
  no_log: true

- name: Ensure Prometheus exporter user can connect
  community.postgresql.postgresql_privs:
    type: database
    database: "{{ postgresql_exporter_database }}"
    roles: "{{ postgresql_exporter_user }}"
    privs: CONNECT
    state: present
    login_host: "{{ postgresql_host }}"
    login_port: "{{ postgresql_port }}"
    login_user: "{{ postgresql_admin_user }}"
    login_password: "{{ postgresql_admin_password }}"
  no_log: true

- name: Grant pg_monitor to Prometheus exporter user
  community.postgresql.postgresql_query:
    db: "{{ postgresql_exporter_database }}"
    query: "GRANT pg_monitor TO \"{{ postgresql_exporter_user }}\";"
    login_host: "{{ postgresql_host }}"
    login_port: "{{ postgresql_port }}"
    login_user: "{{ postgresql_admin_user }}"
    login_password: "{{ postgresql_admin_password }}"
  no_log: true
