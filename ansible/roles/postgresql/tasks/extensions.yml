---
# Manage PostgreSQL extensions via TCP connection

- name: Build extension matrix
  ansible.builtin.set_fact:
    postgresql_extension_pairs: >-
      {{ postgresql_extension_databases_effective | default([]) | product(postgresql_extensions | default([])) | list }}

- name: Ensure PostgreSQL extensions are installed
  community.postgresql.postgresql_ext:
    db: "{{ item.0 }}"
    name: "{{ item.1 }}"
    state: present
    login_host: "{{ postgresql_host }}"
    login_port: "{{ postgresql_port }}"
    login_user: "{{ postgresql_admin_user }}"
    login_password: "{{ postgresql_admin_password }}"
  loop: "{{ postgresql_extension_pairs }}"
  register: postgresql_extensions_apply
  failed_when: false
  no_log: true
  when: postgresql_extension_pairs | length > 0

- name: Fail when extensions are missing
  ansible.builtin.fail:
    msg: "One or more extensions failed to install. Check that the PostgreSQL image includes them."
  when:
    - not postgresql_extensions_ignore_missing | default(false)
    - postgresql_extensions_apply is defined
    - postgresql_extensions_apply.results | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0

- name: Warn when extensions are missing
  ansible.builtin.debug:
    msg: "Some extensions were not installed because they are missing in the image."
  when:
    - postgresql_extensions_ignore_missing | default(false)
    - postgresql_extensions_apply is defined
    - postgresql_extensions_apply.results | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
