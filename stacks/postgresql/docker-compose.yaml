version: "3.8"

services:
  postgres:
    image: postgis/postgis:17-3.4
    env_file:
      - /mnt/proxmox_swarm_data/env-files/postgresql.env
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
      - type: bind
        source: /mnt/postgres-config/postgresql.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
      - type: bind
        source: /mnt/postgres-config/pg_hba.conf
        target: /etc/postgresql/pg_hba.conf
        read_only: true
    networks:
      postgres_network:
        aliases:
          - postgres
      traefik_public:
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == swarm-worker-w2
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.routers.postgres.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.postgres.entrypoints=postgres"
        - "traefik.tcp.routers.postgres.service=postgres"
        - "traefik.tcp.services.postgres.loadbalancer.server.port=5432"

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    env_file:
      - /mnt/proxmox_swarm_data/env-files/postgresql.env
    command:
      - --config.file=/etc/postgres_exporter.yml
    volumes:
      - type: bind
        source: /mnt/postgres-config/postgres_exporter.yml
        target: /etc/postgres_exporter.yml
        read_only: true
    networks:
      - postgres_network
      - monitoring
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  pgadmin:
    image: dpage/pgadmin4:latest
    env_file:
      - /mnt/proxmox_swarm_data/env-files/postgresql.env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - postgres_network
      - traefik_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.tuxito.be`)"
        - "traefik.http.routers.pgadmin.entrypoints=websecure"
        - "traefik.http.routers.pgadmin.tls=true"
        - "traefik.http.routers.pgadmin.tls.certresolver=letsencrypt"
        - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik_public"
        # Middleware for X-Script-Name header
        - "traefik.http.middlewares.pgadmin-headers.headers.customrequestheaders.X-Script-Name=/pgadmin"
        - "traefik.http.routers.pgadmin.middlewares=pgadmin-headers"
networks:
  postgres_network:
    external: true
  traefik_public:
    external: true
  monitoring:
    external: true

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/postgres-backups
  pgadmin_data:
    driver: local
