http:
  routers:
    frigate:
      rule: "Host(`frigate.tuxito.be`)"
      entryPoints:
        - websecure
      service: frigate
      tls:
        certResolver: letsencrypt
        domains:
          - main: "tuxito.be"
            sans:
              - "*.tuxito.be"

  services:
    frigate:
      loadBalancer:
        servers:
          - url: "http://192.168.10.103:5000"
