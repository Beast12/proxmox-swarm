networks:
  proxy:
    external: true

services:
  plex:
    image: plexinc/pms-docker
    ports:
      - 32400:32400/tcp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    networks:
      - proxy
    environment:
      - TZ=Europe/Brussels
      - VERSION=docker
      - PLEX_CLAIM=claim-Krxwiv427B-Y6hsdFQDd
    volumes:
      - plex_config:/config
      - /mnt/nfs/media-nas/tv:/tv
      - /mnt/nfs/media-nas/movies:/movies
      - /mnt/nfs/media-nas/music:/music
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-worker-w1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "homepage.group=Media"
        - "homepage.name=Plex"
        - "homepage.icon=plex.png"
        - "homepage.href=https://plex.tuxito.be"
        - "homepage.description=Media Server"
        - "traefik.enable=true"
        - "traefik.http.routers.plex.rule=Host(`plex.tuxito.be`)"
        - "traefik.http.routers.plex.entrypoints=websecure"
        - "traefik.http.routers.plex.tls.certresolver=letsencrypt"
        - "traefik.http.services.plex.loadbalancer.server.port=32400"
        - "traefik.swarm.network=proxy"

volumes:
  plex_config:
    driver: local
