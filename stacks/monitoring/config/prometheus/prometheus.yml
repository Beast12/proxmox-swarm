global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/rules/alerts.yml"

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Proxmox monitoring via PVE Exporter - CORRECTED per official docs
  - job_name: "pve"
    static_configs:
      - targets:
          - "192.168.10.11" # Just the IP addresses
          - "192.168.10.12" # Just the IP addresses
          - "192.168.10.13" # Just the IP addresses
          - "192.168.10.14" # Just the IP addresses
          - "192.168.10.15" # Just the IP addresses
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["1"]
      node: ["1"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
        # Add friendly names
      - source_labels: [instance]
        regex: "192.168.10.11"
        target_label: instance
        replacement: "proxmox-1"
      - source_labels: [instance]
        regex: "192.168.10.12"
        target_label: instance
        replacement: "proxmox-2"
      - source_labels: [instance]
        regex: "192.168.10.13"
        target_label: instance
        replacement: "proxmox-3"
      - source_labels: [instance]
        regex: "192.168.10.14"
        target_label: instance
        replacement: "proxmox-4"
      - source_labels: [instance]
        regex: "192.168.10.15"
        target_label: instance
        replacement: "proxmox-5"

  # LXC Containers and Services (Node Exporter)
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "ai-services.lan:9100"
          - "database-tools.lan:9100"
          - "productivity.lan:9100"
          - "nextcloud.lan:9100"
          - "plex.lan:9100"
          - "postgresql.lan:9100"
          - "cloudflared.lan:9100"
          - "authentik.lan:9100"
          - "utilities.lan:9100"
          - "changedetection.lan:9100"
          - "development.lan:9100"
          - "entertainment.lan:9100"
          - "frigate.lan:9100"
          - "homepage.lan:9100"
          - "invoices.lan:9100"
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):[0-9]+"
        target_label: instance
        replacement: "${1}"

  # Home Assistant monitoring
  - job_name: "homeassistant"
    scrape_interval: 60s
    metrics_path: /api/prometheus
    bearer_token: "__RENDERED_BY_ANSIBLE__"
    scheme: http
    static_configs:
      - targets: ["192.168.10.28:8123"]

  # Docker containers monitoring (cAdvisor)
  - job_name: "cadvisor"
    scrape_interval: 30s

  - job_name: "tplink-switch"
    metrics_path: /snmp
    params:
      auth: [public_v2]
      module: [if_mib]
    static_configs:
      - targets: ["192.168.10.250"] # switch IP
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: snmp-exporter:9116
      - source_labels: [__param_target]
        target_label: instance
