---
# Example playbook for managing PostgreSQL users in Docker

- name: Configure PostgreSQL databases and users
  hosts: "{{ postgresql_target_host | default('localhost') }}"
  gather_facts: false

  vars_files:
    - ../inventory/host_vars/postgresql.yml # Your inventory with connection details

  roles:
    - postgresql
