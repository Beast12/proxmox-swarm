services:
  esphome:
    image: ghcr.io/esphome/esphome
    container_name: esphome
    restart: unless-stopped
    environment:
      - TZ=Europe/Brussels
      - ESPHOME_DASHBOARD_USE_PING=true
    volumes:
      - /mnt/proxmox_swarm_data/esphome/:/config:rw
      - esphome_cache:/cache:rw
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    labels:
      - "homepage.group=Development Tools"
      - "homepage.name=EspHome"
      - "homepage.icon=esphome.png"
      - "homepage.href=https://esphome.tuxito.be"
      - "homepage.description=ESP Device Manager"
      - "shepherd.enable=true"

volumes:
  esphome_cache:
