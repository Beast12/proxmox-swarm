services:
  server:
    image: ghcr.io/goauthentik/server:2025.8.4
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - apparmor:unconfined
    command: server
    networks:
      - postgres_network
      - services
    volumes:
      - /mnt/proxmox_swarm_data/authentik/media:/media
      - /mnt/proxmox_swarm_data/authentik/custom-templates:/templates
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "homepage.group=Infrastructure"
        - "homepage.name=Authentik"
        - "homepage.icon=authentik.png"
        - "homepage.href=https://sso.tuxito.be"
        - "homepage.description=SSO & Identity Provider"
        - "traefik.enable=true"
        - "traefik.http.routers.authentik.rule=Host(`sso.tuxito.be`)"
        - "traefik.http.routers.authentik.entrypoints=websecure"
        - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
        - "traefik.http.services.authentik.loadbalancer.server.port=9000"
        - "traefik.docker.network=traefik_public"

  worker:
    image: ghcr.io/goauthentik/server:2025.8.4
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    command: worker
    networks:
      - postgres_network
      - services
    user: "1000:1000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/proxmox_swarm_data/authentik/media:/media
      - /mnt/proxmox_swarm_data/authentik/certs:/certs
      - /mnt/proxmox_swarm_data/authentik/custom-templates:/templates
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

networks:
  postgres_network:
    external: true
  services:
    external: true
