version: "3.8"

services:
  vaultwarden:
    image: vaultwarden/server:latest
    networks:
      - traefik_public
      - default
    environment:
      WEBSOCKET_ENABLED: "true"
      ADMIN_TOKEN_FILE: /run/secrets/vaultwarden_admin_token
      DOMAIN: "https://vault.tuxito.be"
    secrets:
      - vaultwarden_admin_token
    volumes:
      - vaultwarden_data:/data
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        # Main web UI
        - "traefik.http.routers.vaultwarden.rule=Host(`vault.tuxito.be`)"
        - "traefik.http.routers.vaultwarden.entrypoints=websecure"
        - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
        - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"

networks:
  traefik_public:
    external: true
    name: traefik_traefik_public

volumes:
  vaultwarden_data:
    driver: local

secrets:
  vaultwarden_admin_token:
    external: true
