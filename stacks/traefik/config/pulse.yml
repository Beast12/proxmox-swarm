http:
  routers:
    proxmox:
      rule: "Host(`pulse.tuxito.be`)"
      entryPoints:
        - websecure
      service: pulse-service
      tls:
        certResolver: letsencrypt
        domains:
          - main: "tuxito.be"
            sans:
              - "*.tuxito.be"

  services:
    pulse-service:
      loadBalancer:
        servers:
          - url: "http://192.168.10.60:7655"
        serversTransport: pulse-transport

  serversTransports:
    pulse-transport:
      insecureSkipVerify: true # Required because Proxmox uses self-signed cert
