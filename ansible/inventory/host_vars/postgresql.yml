---
# Example inventory configuration for PostgreSQL in Docker Compose

# Connection to your PostgreSQL Docker container
postgresql_host: "192.168.10.34"
postgresql_port: 5432
postgresql_connection_mode: "docker_exec"
postgresql_target_host: "swarm-worker-2"
postgresql_manage_configs: true
postgresql_config_dir: "/mnt/postgres-config"
postgresql_hba_allow_all: true
postgresql_extensions_ignore_missing: true

# Admin credentials for PostgreSQL
# Option 1: From Bitwarden
postgresql_admin_user: "postgres"
postgresql_admin_password: "{{ lookup('bitwarden', 'PostgreSQL Admin') }}"
postgresql_exporter_user: "postgres_exporter"
postgresql_exporter_password: "{{ lookup('bitwarden', 'PostgreSQL Exporter') }}"

# Database users with Bitwarden lookups
postgresql_users:
  - name: nextcloud
    password: "{{ lookup('bitwarden', 'Nextcloud Database') }}"
    db: nextcloud

  - name: docmost
    password: "{{ lookup('bitwarden', 'DocMost Database') }}"
    db: docmost

  - name: paperless
    password: "{{ lookup('bitwarden', 'Paperless Database') }}"
    db: paperless

  - name: penpot
    password: "{{ lookup('bitwarden', 'Penpot Database') }}"
    db: penpot

  - name: n8n
    password: "{{ lookup('bitwarden', 'n8n Database') }}"
    db: n8n

  - name: skyvern
    password: "{{ lookup('bitwarden', 'Skyvern Database') }}"
    db: skyvern

  - name: adventurelog
    password: "{{ lookup('bitwarden', 'AdventureLog Database') }}"
    db: adventurelog

  - name: immich
    password: "{{ lookup('bitwarden', 'Immich Database') }}"
    db: immich

  - name: authentik
    password: "{{ lookup('bitwarden', 'Authentik Database') }}"
    db: authentik
