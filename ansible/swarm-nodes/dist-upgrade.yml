---
- name: Dist-upgrade and reboot Docker Swarm nodes
  hosts: swarm
  serial: 1 # Process one node at a time to maintain swarm availability
  gather_facts: yes
  become: yes

  vars:
    # Maximum time to wait for swarm services to stabilize (seconds)
    swarm_stabilization_wait: 60
    # Maximum time to wait for node to come back online (seconds)
    reboot_timeout: 300
    # Pre-reboot delay to allow for graceful service migration
    pre_reboot_delay: 30

  tasks:
    - name: Check if node is part of Docker Swarm
      command: docker info --format '{{ '{{' }}.Swarm.LocalNodeState{{ '}}' }}'
      register: swarm_state
      changed_when: false
      failed_when: false

    - name: Get node hostname
      command: hostname
      register: node_hostname
      changed_when: false

    - name: Get swarm node ID
      shell: docker info --format '{{ '{{' }}.Swarm.NodeID{{ '}}' }}'
      register: node_id
      changed_when: false
      when: swarm_state.stdout == "active"

    - name: Set node to drain mode (if swarm node)
      command: docker node update --availability drain {{ node_id.stdout }}
      when:
        - swarm_state.stdout == "active"
        - groups['swarm_managers'] | length > 0
      delegate_to: "{{ groups['swarm_managers'][0] }}"
      ignore_errors: yes

    - name: Wait for services to migrate
      pause:
        seconds: "{{ swarm_stabilization_wait }}"
      when: swarm_state.stdout == "active"

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Perform dist-upgrade
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: upgrade_result

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Display upgrade summary
      debug:
        msg: "Upgraded {{ upgrade_result.changed }} packages on {{ inventory_hostname }}"

    - name: Pause before reboot
      pause:
        seconds: "{{ pre_reboot_delay }}"
      when: reboot_required.stat.exists

    - name: Reboot the node
      reboot:
        reboot_timeout: "{{ reboot_timeout }}"
        msg: "Rebooting for dist-upgrade"
        pre_reboot_delay: 5
      when: reboot_required.stat.exists

    - name: Wait for node to be back online
      wait_for_connection:
        delay: 10
        timeout: "{{ reboot_timeout }}"
      when: reboot_required.stat.exists

    - name: Wait for Docker daemon to be ready
      command: docker info
      register: docker_ready
      retries: 30
      delay: 10
      until: docker_ready.rc == 0
      changed_when: false
      when: swarm_state.stdout == "active"

    - name: Set node back to active mode
      command: docker node update --availability active {{ node_id.stdout }}
      when:
        - swarm_state.stdout == "active"
        - groups['swarm_managers'] | length > 0
      delegate_to: "{{ groups['swarm_managers'][0] }}"

    - name: Wait for swarm to stabilize
      pause:
        seconds: "{{ swarm_stabilization_wait }}"
      when: swarm_state.stdout == "active"

    - name: Verify node status
      command: docker node ls --filter "id={{ node_id.stdout }}"
      register: node_status
      when: swarm_state.stdout == "active"
      delegate_to: "{{ groups['swarm_managers'][0] }}"
      changed_when: false

    - name: Display node status
      debug:
        var: node_status.stdout_lines
      when: swarm_state.stdout == "active"
