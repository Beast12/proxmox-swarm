---
# =============================================================================
# SWARM CLUSTER CONFIGURATION - ALL NODES
# =============================================================================

- name: Configure Shared Storage (All Swarm Nodes)
  hosts: swarm_managers,swarm_workers
  become: yes

  vars:
    nfs_server: "192.168.10.10" # Update with your Synology IP

    # Define your NFS shares
    nfs_shares:
      - name: postgres_backups
        remote_path: /volume1/postgresql_backups
        local_path: /mnt/postgres-backups
        options: "rw,sync,hard,intr,timeo=600,retrans=5"
        owner: "999" # Postgres user UID
        group: "999" # Postgres group GID
        mode: "0775"
      - name: shared_data
        remote_path: /volume1/proxmox_swarm_data
        local_path: /mnt/proxmox_swarm_data
        options: "rw,sync,hard,intr,timeo=600,retrans=5"
        mode: "0775"

  roles:
    - nfs_mounts

  post_tasks:
    - name: Verify NFS mounts are accessible
      ansible.builtin.command: "ls -la {{ item.local_path }}"
      loop: "{{ nfs_shares }}"
      register: mount_verify
      changed_when: false
      failed_when: mount_verify.rc != 0

# =============================================================================
# SWARM MANAGERS ONLY - HIGH AVAILABILITY
# =============================================================================

- name: Deploy Keepalived on Swarm Managers
  hosts: swarm_managers
  become: yes

  roles:
    - keepalived

  post_tasks:
    - name: Verify Keepalived is running
      ansible.builtin.systemd:
        name: keepalived
        state: started
        enabled: yes
      check_mode: yes
      register: keepalived_check

    - name: Display Keepalived status
      ansible.builtin.debug:
        msg: "Keepalived is active on {{ inventory_hostname }}"
      when: keepalived_check is succeeded

- name: Deploy Authentik env file to shared storage
  hosts: swarm_managers
  become: yes

  roles:
    - authentik_env
    - redis_service
    - traefik_config

- name: Deploy Monitoring Config to Shared Storage
  hosts: swarm_managers
  become: yes

  roles:
    - monitoring

- name: Deploy Tools Stack Storage (All Swarm Nodes)
  hosts: swarm_managers,swarm_workers
  become: yes

  roles:
    - tools_stack

- name: Deploy Plex Mounts (All Swarm Nodes)
  hosts: swarm_managers,swarm_workers
  become: yes

  roles:
    - plex

- name: Create Docker Networks (Swarm Managers)
  hosts: swarm_managers
  become: yes

  vars:
    docker_networks:
      # Public-facing network for Traefik
      - name: traefik_public
        driver: overlay
        attachable: true
        state: present
        options:
          encrypted: "true"

      # Monitoring stack network
      - name: monitoring
        driver: overlay
        attachable: true
        state: present
        options:
          encrypted: "false"

      # Shared services network
      - name: services
        driver: overlay
        attachable: true
        state: present
        options:
          encrypted: "false"

      # PostgreSQL network
      - name: postgres_network
        driver: overlay
        attachable: true
        state: present
        options:
          encrypted: "true"

  roles:
    - docker_networks

# =============================================================================
# SWARM WORKERS ONLY - OPTIONAL CONFIGURATIONS
# =============================================================================

# Uncomment this section if you need worker-specific configurations
# - name: Configure Swarm Workers
#   hosts: swarm_workers
#   become: yes
#
#   tasks:
#     - name: Worker-specific task example
#       ansible.builtin.debug:
#         msg: "Configuring worker {{ inventory_hostname }}"

# =============================================================================
# VERIFICATION - ALL NODES
# =============================================================================

- name: Verify Swarm Infrastructure
  hosts: swarm_managers,swarm_workers
  become: yes
  gather_facts: yes

  tasks:
    - name: Check NFS mounts status
      ansible.builtin.shell: "df -h | grep nfs || echo 'No NFS mounts found'"
      register: nfs_status
      changed_when: false

    - name: Check Docker networks (managers only)
      ansible.builtin.shell: "docker network ls --filter scope=swarm"
      register: docker_networks_status
      changed_when: false
      when: inventory_hostname in groups['swarm_managers']

    - name: Check Keepalived VIP (managers only)
      ansible.builtin.shell: "ip addr show | grep {{ keepalived_vip }} || echo 'VIP not on this node'"
      register: vip_status
      changed_when: false
      when: inventory_hostname in groups['swarm_managers']

    - name: Display infrastructure summary
      ansible.builtin.debug:
        msg: |
          ============================================
          Node: {{ inventory_hostname }}
          Type: {{ 'Manager' if inventory_hostname in groups['swarm_managers'] else 'Worker' }}
          ============================================
          NFS Mounts:
          {{ nfs_status.stdout }}

          {% if inventory_hostname in groups['swarm_managers'] %}
          Docker Networks:
          {{ docker_networks_status.stdout }}

          Keepalived VIP Status:
          {{ vip_status.stdout }}
          {% endif %}
