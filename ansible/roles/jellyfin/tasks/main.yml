---
- name: Install Jellyfin prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Create keyrings directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Jellyfin signing key
  ansible.builtin.get_url:
    url: "{{ jellyfin_apt_key_url }}"
    dest: /tmp/jellyfin-signing.key
    mode: "0644"

- name: Install Jellyfin keyring
  ansible.builtin.command: gpg --dearmor -o /usr/share/keyrings/jellyfin.gpg /tmp/jellyfin-signing.key
  args:
    creates: /usr/share/keyrings/jellyfin.gpg

- name: Configure Jellyfin apt repository
  ansible.builtin.apt_repository:
    repo: "{{ jellyfin_apt_repo }}"
    filename: jellyfin
    state: present

- name: Install Jellyfin package
  ansible.builtin.apt:
    name: "{{ jellyfin_package_name }}"
    state: present
    update_cache: yes

- name: Ensure Jellyfin directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: jellyfin
    group: jellyfin
    mode: "0755"
  loop:
    - "{{ jellyfin_data_dir }}"
    - "{{ jellyfin_config_dir }}"
    - "{{ jellyfin_cache_dir }}"
    - "{{ jellyfin_log_dir }}"

- name: Configure Jellyfin data directory
  ansible.builtin.lineinfile:
    path: /etc/default/jellyfin
    create: true
    regexp: '^JELLYFIN_DATA_DIR='
    line: 'JELLYFIN_DATA_DIR="{{ jellyfin_data_dir }}"'
  notify: restart jellyfin

- name: Configure Jellyfin config directory
  ansible.builtin.lineinfile:
    path: /etc/default/jellyfin
    create: true
    regexp: '^JELLYFIN_CONFIG_DIR='
    line: 'JELLYFIN_CONFIG_DIR="{{ jellyfin_config_dir }}"'
  notify: restart jellyfin

- name: Configure Jellyfin cache directory
  ansible.builtin.lineinfile:
    path: /etc/default/jellyfin
    create: true
    regexp: '^JELLYFIN_CACHE_DIR='
    line: 'JELLYFIN_CACHE_DIR="{{ jellyfin_cache_dir }}"'
  notify: restart jellyfin

- name: Configure Jellyfin log directory
  ansible.builtin.lineinfile:
    path: /etc/default/jellyfin
    create: true
    regexp: '^JELLYFIN_LOG_DIR='
    line: 'JELLYFIN_LOG_DIR="{{ jellyfin_log_dir }}"'
  notify: restart jellyfin

- name: Add jellyfin user to video group for HW transcoding
  ansible.builtin.user:
    name: jellyfin
    groups:
      - video
    append: true
  when: jellyfin_enable_hw_transcode
  notify: restart jellyfin

- name: Add jellyfin user to render group for HW transcoding
  ansible.builtin.user:
    name: jellyfin
    groups:
      - render
    append: true
  when: jellyfin_enable_hw_transcode
  notify: restart jellyfin

- name: Ensure Jellyfin service is enabled and running
  ansible.builtin.systemd:
    name: "{{ jellyfin_service_name }}"
    enabled: yes
    state: started

