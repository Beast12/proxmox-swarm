# roles/nfs_mounts/tasks/main.yml
---
- name: Install NFS client packages
  ansible.builtin.apt:
    name:
      - nfs-common
      - nfs4-acl-tools
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Create mount point directories
  ansible.builtin.file:
    path: "{{ item.local_path }}"
    state: directory
    mode: "0755"
  loop: "{{ nfs_shares }}"

- name: Test NFS connectivity
  ansible.builtin.command: "showmount -e {{ nfs_server }}"
  register: nfs_exports
  changed_when: false
  failed_when: false

- name: Display available NFS exports
  ansible.builtin.debug:
    msg: "{{ nfs_exports.stdout_lines }}"
  when: nfs_exports.rc == 0

- name: Mount NFS shares
  ansible.posix.mount:
    src: "{{ nfs_server }}:{{ item.remote_path }}"
    path: "{{ item.local_path }}"
    fstype: nfs
    opts: "{{ item.options | default(nfs_default_options) }},nfsvers={{ nfs_version }}"
    state: mounted
  loop: "{{ nfs_shares }}"

- name: Verify mounts are accessible
  ansible.builtin.stat:
    path: "{{ item.local_path }}"
  register: mount_check
  loop: "{{ nfs_shares }}"
  failed_when: not mount_check.stat.exists

- name: Set ownership and permissions on NFS mounts for Docker
  ansible.builtin.file:
    path: "{{ item.local_path }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0775') }}"
    state: directory
  loop: "{{ nfs_shares }}"
  ignore_errors: yes

- name: Create .mounted marker files
  ansible.builtin.file:
    path: "{{ item.local_path }}/.mounted"
    state: touch
    mode: "0644"
  loop: "{{ nfs_shares }}"
  changed_when: false
