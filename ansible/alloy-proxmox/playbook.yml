---
- name: Deploy Grafana Alloy to Proxmox Cluster
  hosts: proxmox
  become: true
  vars_files:
    - vars/main.yml

  tasks:
    - name: Display deployment info
      debug:
        msg: |
          🚀 Deploying Grafana Alloy v{{ alloy_version }}
          📊 Metrics → {{ prometheus_url }}
          📝 Logs → {{ loki_url }}
          🖥️  Host: {{ ansible_hostname }}

    - name: Install prerequisites
      apt:
        name:
          - apt-transport-https
          - gpg
          - curl
        state: present
        update_cache: yes

    - name: Create APT keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Grafana GPG key
      get_url:
        url: "{{ alloy_apt_key_url }}"
        dest: /tmp/grafana.key
        mode: "0644"

    - name: Convert and install GPG key
      shell: |
        cat /tmp/grafana.key | gpg --dearmor -o /etc/apt/keyrings/grafana.asc
        chmod 644 /etc/apt/keyrings/grafana.asc
      args:
        creates: /etc/apt/keyrings/grafana.asc

    - name: Add Grafana APT repository
      apt_repository:
        repo: "{{ alloy_apt_repo }}"
        state: present
        filename: grafana

    - name: Update APT cache
      apt:
        update_cache: yes

    - name: Install Grafana Alloy
      apt:
        name: alloy
        state: present

    - name: Create Alloy directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ alloy_config_dir }}"
        - "{{ alloy_data_dir }}"

    - name: Deploy Alloy configuration
      template:
        src: templates/alloy-config.alloy.j2
        dest: "{{ alloy_config_dir }}/config.alloy"
        owner: root
        group: root
        mode: "0644"
      notify: restart alloy

    - name: Verify Alloy configuration syntax
      command: "/usr/bin/alloy fmt {{ alloy_config_dir }}/config.alloy --write=false"
      register: alloy_fmt
      changed_when: false
      failed_when: alloy_fmt.rc != 0

    - name: Enable and start Alloy service
      systemd:
        name: alloy
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Wait for Alloy HTTP interface
      wait_for:
        port: "{{ alloy_http_listen_port }}"
        delay: 2
        timeout: 30

    - name: Check Alloy health
      uri:
        url: "http://localhost:{{ alloy_http_listen_port }}/-/healthy"
        method: GET
        status_code: 200
      register: alloy_health
      retries: 5
      delay: 3
      until: alloy_health.status == 200

    - name: Display deployment success
      debug:
        msg: |
          ✅ Alloy successfully deployed on {{ ansible_hostname }}
          🌐 Web UI: http://{{ ansible_host }}:{{ alloy_http_listen_port }}
          📊 Collecting metrics from node_exporter
          📝 Tailing {{ log_paths | length }} log categories

  handlers:
    - name: restart alloy
      systemd:
        name: alloy
        state: restarted

- name: Verify Deployment Across Cluster
  hosts: proxmox
  become: true
  vars_files:
    - vars/main.yml

  tasks:
    - name: Get Alloy service status
      command: systemctl status alloy --no-pager --lines=0
      register: service_status
      changed_when: false
      failed_when: false

    - name: Display cluster status
      debug:
        msg: |
          Host: {{ ansible_hostname }}
          Service: {{ 'Running ✓' if 'active (running)' in service_status.stdout else 'Not Running ✗' }}
          Web UI: http://{{ ansible_host }}:{{ alloy_http_listen_port }}
