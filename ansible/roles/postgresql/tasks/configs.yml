---
# Manage PostgreSQL configuration files on the Docker host

- name: Ensure PostgreSQL config directory exists
  ansible.builtin.file:
    path: "{{ postgresql_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: "{{ postgresql_config_become | default(false) }}"

- name: Deploy postgresql.conf
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ postgresql_config_dir }}/postgresql.conf"
    owner: root
    group: root
    mode: "0644"
  become: "{{ postgresql_config_become | default(false) }}"
  notify:
    - Reload PostgreSQL (tcp)
    - Reload PostgreSQL (docker exec)

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_config_dir }}/pg_hba.conf"
    owner: root
    group: root
    mode: "0644"
  become: "{{ postgresql_config_become | default(false) }}"
  notify:
    - Reload PostgreSQL (tcp)
    - Reload PostgreSQL (docker exec)

- name: Deploy postgres_exporter.yml
  ansible.builtin.template:
    src: postgres_exporter.yml.j2
    dest: "{{ postgresql_config_dir }}/{{ postgresql_exporter_config_name }}"
    owner: root
    group: root
    mode: "0644"
  become: "{{ postgresql_config_become | default(false) }}"
  when: postgresql_manage_exporter_config | default(false)
