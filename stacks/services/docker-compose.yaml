version: "3.8"

services:
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    user: "999:999"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /mnt/proxmox_swarm_data/services/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - /mnt/proxmox_swarm_data/services/redis/data:/data:rw
    networks:
      services:
        aliases:
          - valkey
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

networks:
  services:
    external: true
