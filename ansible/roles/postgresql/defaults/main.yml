---
# Connection details for PostgreSQL (Docker or remote)
postgresql_host: "localhost"
postgresql_port: 5432
postgresql_admin_user: "postgres"
postgresql_admin_password: "" # Should be set in inventory or vault
postgresql_admin_database: "postgres"
postgresql_connection_mode: "tcp" # tcp or docker_exec

# Wait for PostgreSQL to be ready before running tasks
postgresql_wait_for_ready: true

# Docker exec settings (used when postgresql_connection_mode == "docker_exec")
postgresql_docker_service_name: "postgresql_postgres"
postgresql_update_passwords: true

# Extension management
postgresql_manage_extensions: true
postgresql_extensions:
  - postgis
  - postgis_topology
  - vector
  - vectorchord
postgresql_extensions_databases: []
postgresql_extensions_ignore_missing: false

# Prometheus exporter user
postgresql_enable_exporter_user: true
postgresql_exporter_user: "postgres_exporter"
postgresql_exporter_password: ""
postgresql_exporter_database: "postgres"

# Config management
postgresql_manage_configs: true
postgresql_config_dir: "/mnt/postgres-config"
postgresql_config_become: true
postgresql_hba_allow_all: true
postgresql_hba_allow_subnets: []
postgresql_hba_monitoring_subnets: []

# Users and databases configuration
# Passwords are retrieved from Bitwarden using the lookup plugin
postgresql_users: []
