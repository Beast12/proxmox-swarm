services:
  dockhand:
    image: fnsys/dockhand:latest
    env_file:
      - /mnt/proxmox_swarm_data/env-files/dockhand.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/proxmox_swarm_data/dockhand/data:/app/data:rw
    networks:
      - proxy
      - dockhand_internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.50"
          memory: "2G"
        reservations:
          cpus: "0.50"
          memory: "512M"
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      labels:
        - "homepage.group=Infrastructure"
        - "homepage.name=Dockhand"
        - "homepage.icon=dockhand.png"
        - "homepage.href=https://dockhand.tuxito.be"
        - "homepage.description=Docker & Swarm Management"
        - "traefik.enable=true"
        - "traefik.http.routers.dockhand.rule=Host(`dockhand.tuxito.be`)"
        - "traefik.http.routers.dockhand.entrypoints=websecure"
        - "traefik.http.routers.dockhand.tls.certresolver=letsencrypt"
        - "traefik.http.services.dockhand.loadbalancer.server.port=3000"
        - "traefik.swarm.network=proxy"
        - "shepherd.enable=true"

  hawser:
    image: ghcr.io/finsys/hawser:latest
    env_file:
      - /mnt/proxmox_swarm_data/env-files/dockhand.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hawser_stacks:/data/stacks
    ports:
      - target: 2376
        published: 2376
        protocol: tcp
        mode: host
    networks:
      - dockhand_internal
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.50"
          memory: "512M"
        reservations:
          cpus: "0.10"
          memory: "128M"
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3

volumes:
  hawser_stacks:

networks:
  proxy:
    external: true
  dockhand_internal:
    driver: overlay
    attachable: true
