services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    user: "65534"
    security_opt:
      - apparmor:unconfined
    networks:
      - monitoring
      - proxy
    volumes:
      - /mnt/proxmox_swarm_data/monitoring/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/proxmox_swarm_data/monitoring/config/prometheus/rules:/etc/prometheus/rules:ro
      - /mnt/proxmox_swarm_data/monitoring/data/prometheus:/prometheus:rw
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=50GB"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "homepage.group=Monitoring"
        - "homepage.name=Prometheus"
        - "homepage.icon=prometheus.png"
        - "homepage.href=https://prometheus.tuxito.be"
        - "homepage.description=Metrics Collection & Storage"
        - "traefik.enable=true"
        - "traefik.http.routers.prometheus.rule=Host(`prometheus.tuxito.be`)"
        - "traefik.http.routers.prometheus.entrypoints=websecure"
        - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
        - "traefik.swarm.network=proxy"
    depends_on:
      - pve-exporter
      - cadvisor
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    networks:
      - monitoring
      - proxy
    volumes:
      - /mnt/proxmox_swarm_data/monitoring/config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /mnt/proxmox_swarm_data/monitoring/data/alertmanager:/alertmanager:rw
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=https://alertmanager.tuxito.be"
      - "--cluster.listen-address="
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "homepage.group=Monitoring"
        - "homepage.name=Alertmanager"
        - "homepage.icon=prometheus.png"
        - "homepage.href=https://alertmanager.tuxito.be"
        - "homepage.description=Alert Management & Routing"
        - "traefik.enable=true"
        - "traefik.http.routers.alertmanager.rule=Host(`alertmanager.tuxito.be`)"
        - "traefik.http.routers.alertmanager.entrypoints=websecure"
        - "traefik.http.routers.alertmanager.tls.certresolver=letsencrypt"
        - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
        - "traefik.swarm.network=proxy"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    networks:
      - monitoring
      - proxy
    environment:
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel
    volumes:
      - /mnt/proxmox_swarm_data/monitoring/data/grafana:/var/lib/grafana:rw
      - /mnt/proxmox_swarm_data/monitoring/config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - /mnt/proxmox_swarm_data/monitoring/config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "homepage.group=Monitoring"
        - "homepage.name=Grafana"
        - "homepage.icon=grafana.png"
        - "homepage.href=https://grafana.tuxito.be"
        - "homepage.description=Monitoring Dashboards"
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`grafana.tuxito.be`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        - "traefik.swarm.network=proxy"

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    networks:
      - monitoring
    volumes:
      - /mnt/proxmox_swarm_data/monitoring/config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - /mnt/proxmox_swarm_data/monitoring/data/loki:/loki:rw
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "homepage.group=Monitoring"
        - "homepage.name=Loki"
        - "homepage.icon=loki.svg"
        - "homepage.href=http://monitoring.lan:3100"
        - "homepage.description=Log Aggregation"

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    ports:
      - "514:1514/udp"
    networks:
      - monitoring
    volumes:
      - /mnt/proxmox_swarm_data/monitoring/config/promtail-config/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    networks:
      - monitoring
    volumes:
      - /mnt/proxmox_swarm_data/monitoring/config/pve-exporter/pve.yml:/etc/pve.yml:ro
    command: --config.file=/etc/pve.yml --collector.status --collector.version --web.listen-address=:9221
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    networks:
      - monitoring
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    networks:
      - monitoring
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(proc|sys|dev|run|var/lib/docker/.+)($$|/)"
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  snmp-exporter:
    image: prom/snmp-exporter:v0.29.0
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    networks:
      - monitoring
    volumes:
      - /mnt/proxmox_swarm_data/monitoring/config/snmp/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    command: "--config.file=/etc/snmp_exporter/snmp.yml"
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
  influxdb:
    image: influxdb:latest
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "homepage.group=Databases"
        - "homepage.name=InfluxDB"
        - "homepage.icon=influxdb.png"
        - "homepage.href=https://influxdb.tuxito.be"
        - "homepage.description=Time Series Database"
        - "traefik.enable=true"
        - "traefik.http.routers.influxdb.rule=Host(`influxdb.tuxito.be`)"
        - "traefik.http.routers.influxdb.entrypoints=websecure"
        - "traefik.http.routers.influxdb.tls.certresolver=letsencrypt"
        - "traefik.http.services.influxdb.loadbalancer.server.port=8086"
        - "traefik.swarm.network=proxy"
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
    env_file:
      - /mnt/proxmox_swarm_data/env-files/influxdb.env
    volumes:
      - influxdb-data:/var/lib/influxdb2:rw
    networks:
      - monitoring
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  shepherd:
    image: containrrr/shepherd
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: Europe/Brussels
      FILTER_SERVICES: "label=shepherd.enable=true"
      BLACKLIST_SERVICES: "shepherd monitoring_prometheus monitoring_grafana"
      APPRISE_SIDECAR_URL: "services_apprise:5000" # Use service name
      RUN_ONCE_AND_EXIT: "true"
      ROLLBACK_ON_FAILURE: "true"
      VERBOSE: "true"
    deploy:
      mode: replicated
      replicas: 0
      placement:
        constraints:
          - node.role == manager
      labels:
        - shepherd.enable=false
        - swarm.cronjob.enable=true
        - swarm.cronjob.schedule=0 4 * * *
        - swarm.cronjob.skip-running=true
      restart_policy:
        condition: none
    networks:
      - monitoring
      - services
      - cronjob_net

networks:
  monitoring:
    external: true
  proxy:
    external: true
  services:
    external: true

volumes:
  influxdb-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.10.10,rw,nolock,soft,timeo=14,intr
      device: ":/volume1/influxdb"
