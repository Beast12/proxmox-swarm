services:
  traefik:
    image: traefik:v3.6

    networks:
      - traefik_public

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt

    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_dns_api_token

    secrets:
      - cf_dns_api_token
      - dashboard_users

    command:
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"

      # Let's Encrypt with Cloudflare DNS Challenge
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53"

      # Uncomment for testing to avoid rate limits
      # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"

      # Swarm Provider
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.watch=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=traefik_traefik_public"

      # Dashboard
      - "--api.dashboard=true"

      # Logging
      - "--log.level=${LOG_LEVEL:-INFO}"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"

      # Metrics
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addRoutersLabels=true"

    deploy:
      mode: replicated
      replicas: ${TRAEFIK_REPLICAS:-2}
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

      labels:
        - "traefik.enable=true"

        # Dashboard Router
        - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DOMAIN}`)"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"

        # Dashboard Authentication
        - "traefik.http.middlewares.dashboard-auth.basicauth.usersfile=/run/secrets/dashboard_users_traefik"
        - "traefik.http.routers.dashboard.middlewares=dashboard-auth@swarm"

        # Required for Swarm - specify port for the API
        - "traefik.http.services.traefik.loadbalancer.server.port=8080"

networks:
  traefik_public:
    driver: overlay
    attachable: true

volumes:
  traefik-certificates:
    driver: local

secrets:
  cf_dns_api_token:
    external: true
  dashboard_users_traefik:
    external: true
