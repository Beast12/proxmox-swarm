http:
  routers:
    music-assistant:
      rule: "Host(`music-assistant.tuxito.be`)"
      entryPoints:
        - websecure
      service: music-assistant
      tls:
        certResolver: letsencrypt
        domains:
          - main: "tuxito.be"
            sans:
              - "*.tuxito.be"

  services:
    music-assistant:
      loadBalancer:
        servers:
          - url: "http://192.168.10.28:8097"
