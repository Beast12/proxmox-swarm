version: "3.8"

services:
  postgres:
    image: postgres:18
    env_file:
      - /mnt/proxmox_swarm_data/env-files/postgresql.env
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql
      - /mnt/postgres-backups:/backups
      - type: bind
        source: /mnt/proxmox_swarm_data/postgresql/postgresql.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
      - type: bind
        source: /mnt/proxmox_swarm_data/postgresql/pg_hba.conf
        target: /etc/postgresql/pg_hba.conf
        read_only: true
    networks:
      postgres_network:
        aliases:
          - postgres
      proxy:
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == swarm-worker-w2
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.routers.postgres.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.postgres.entrypoints=postgres"
        - "traefik.tcp.routers.postgres.service=postgres"
        - "traefik.tcp.services.postgres.loadbalancer.server.port=5432"
  postgres_backup:
    image: prodrigestivill/postgres-backup-local
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=ALL # or specific database
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=2
      - BACKUP_KEEP_MONTHS=1
    volumes:
      - /mnt/postgres-backups:/backups
    networks:
      - postgres_network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == swarm-worker-w2
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    env_file:
      - /mnt/proxmox_swarm_data/env-files/postgresql.env
    command:
      - --config.file=/etc/postgres_exporter.yml
    volumes:
      - type: bind
        source: /mnt/proxmox_swarm_data/postgresql/postgres_exporter.yml
        target: /etc/postgres_exporter.yml
        read_only: true
    networks:
      - postgres_network
      - monitoring
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  pgadmin:
    image: dpage/pgadmin4:latest
    env_file:
      - /mnt/proxmox_swarm_data/env-files/postgresql.env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - postgres_network
      - proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.tuxito.be`)"
        - "traefik.http.routers.pgadmin.entrypoints=websecure"
        - "traefik.http.routers.pgadmin.tls=true"
        - "traefik.http.routers.pgadmin.tls.certresolver=letsencrypt"
        - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
        - "traefik.swarm.network=proxy"
        # Middleware for X-Script-Name header
        - "traefik.http.middlewares.pgadmin-headers.headers.customrequestheaders.X-Script-Name=/pgadmin"
        - "traefik.http.routers.pgadmin.middlewares=pgadmin-headers"
networks:
  postgres_network:
    external: true
  proxy:
    external: true
  monitoring:
    external: true

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
