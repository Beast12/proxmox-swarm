services:
  influxdb:
    image: influxdb:latest
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "homepage.group=Database"
        - "homepage.name=InfluxDB"
        - "homepage.icon=influxdb.png"
        - "homepage.href=https://influxdb.tuxito.be"
        - "homepage.description=Time Series Database"
        - "traefik.enable=true"
        - "traefik.http.routers.influxdb.rule=Host(`influxdb.tuxito.be`)"
        - "traefik.http.routers.influxdb.entrypoints=websecure"
        - "traefik.http.routers.influxdb.tls.certresolver=letsencrypt"
        - "traefik.http.services.influxdb.loadbalancer.server.port=8086"
        - "traefik.docker.network=traefik_public"
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
    env_file:
      - /mnt/proxmox_swarm_data/env-files/influxdb.env
    volumes:
      - influxdb-data:/var/lib/influxdb2:rw
    networks:
      - influxdb-network
      - traefik_public
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  influxdb-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.10.10,rw,nolock,soft,timeo=14,intr
      device: ":/volume1/influxdb"

networks:
  influxdb-network:
    driver: overlay
    attachable: true
  traefik_public:
    external: true
