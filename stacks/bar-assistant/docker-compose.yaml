version: "3.8"

networks:
  proxy:
    external: true
  services:
    external: true
  bar-assistant_internal:
    driver: overlay

services:
  bar-assistant:
    image: barassistant/server:v5
    env_file:
      - /mnt/proxmox_swarm_data/env-files/bar-assistant.env
    environment:
      APP_URL: https://bar-api.tuxito.be
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      ALLOW_REGISTRATION: "true"
    volumes:
      - /mnt/proxmox_swarm_data/bar-assistant/data:/var/www/cocktails/storage/bar-assistant:rw
    networks:
      - proxy
      - services
      - bar-assistant_internal
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "2.00"
          memory: "2G"
        reservations:
          cpus: "0.50"
          memory: "512M"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.bar-assistant-api.rule=Host(`bar-api.tuxito.be`)"
        - "traefik.http.routers.bar-assistant-api.entrypoints=websecure"
        - "traefik.http.routers.bar-assistant-api.tls=true"
        - "traefik.http.routers.bar-assistant-api.tls.certresolver=letsencrypt"
        - "traefik.http.services.bar-assistant-api.loadbalancer.server.port=8080"
        - "traefik.swarm.network=proxy"

  salt-rim:
    image: barassistant/salt-rim:v4
    env_file:
      - /mnt/proxmox_swarm_data/env-files/bar-assistant.env
    environment:
      API_URL: https://bar-api.tuxito.be
      MEILISEARCH_URL: https://bar-search.tuxito.be
    networks:
      - proxy
      - bar-assistant_internal
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "256M"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.bar-assistant.rule=Host(`bar.tuxito.be`)"
        - "traefik.http.routers.bar-assistant.entrypoints=websecure"
        - "traefik.http.routers.bar-assistant.tls=true"
        - "traefik.http.routers.bar-assistant.tls.certresolver=letsencrypt"
        - "traefik.http.services.bar-assistant.loadbalancer.server.port=8080"
        - "traefik.swarm.network=proxy"

  meilisearch:
    image: getmeili/meilisearch:v1.15
    env_file:
      - /mnt/proxmox_swarm_data/env-files/bar-assistant.env
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes:
      - /mnt/proxmox_swarm_data/bar-assistant/meilisearch:/meili_data:rw
    networks:
      proxy:
      bar-assistant_internal:
        aliases:
          - meilisearch
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "256M"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.bar-assistant-search.rule=Host(`bar-search.tuxito.be`)"
        - "traefik.http.routers.bar-assistant-search.entrypoints=websecure"
        - "traefik.http.routers.bar-assistant-search.tls=true"
        - "traefik.http.routers.bar-assistant-search.tls.certresolver=letsencrypt"
        - "traefik.http.services.bar-assistant-search.loadbalancer.server.port=7700"
        - "traefik.swarm.network=proxy"
