---
# Manage PostgreSQL extensions via docker exec

- name: Build extension matrix
  ansible.builtin.set_fact:
    postgresql_extension_pairs: >-
      {{ postgresql_extension_databases_effective | default([]) | product(postgresql_extensions | default([])) | list }}

- name: Find PostgreSQL container by service label
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - -q
      - --filter
      - "label=com.docker.swarm.service.name={{ postgresql_docker_service_name }}"
  register: postgresql_container_by_label
  changed_when: false
  when: postgresql_extension_pairs | length > 0

- name: Find PostgreSQL container by name filter
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - -q
      - --filter
      - "name={{ postgresql_docker_service_name }}"
  register: postgresql_container_by_name
  changed_when: false
  when:
    - postgresql_extension_pairs | length > 0
    - postgresql_container_by_label.stdout | trim == ""

- name: Set PostgreSQL container ID
  ansible.builtin.set_fact:
    postgresql_container_id: >-
      {{ (postgresql_container_by_label.stdout | trim)
         if (postgresql_container_by_label.stdout | trim) != ""
         else (postgresql_container_by_name.stdout | trim) }}
  when: postgresql_extension_pairs | length > 0
  no_log: true

- name: Fail if PostgreSQL container is not found
  ansible.builtin.fail:
    msg: "PostgreSQL container not found for service/name '{{ postgresql_docker_service_name }}'"
  when:
    - postgresql_extension_pairs | length > 0
    - postgresql_container_id | default('') | trim == ""

- name: Ensure PostgreSQL extensions are installed
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgresql_admin_password }}"
      - "{{ postgresql_container_id }}"
      - psql
      - -U
      - "{{ postgresql_admin_user }}"
      - -d
      - "{{ item.0 }}"
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "CREATE EXTENSION IF NOT EXISTS \"{{ item.1 }}\";"
  loop: "{{ postgresql_extension_pairs }}"
  register: postgresql_extensions_apply
  failed_when: false
  no_log: true
  when: postgresql_extension_pairs | length > 0

- name: Fail when extensions are missing
  ansible.builtin.fail:
    msg: "One or more extensions failed to install. Check that the PostgreSQL image includes them."
  when:
    - not postgresql_extensions_ignore_missing | default(false)
    - postgresql_extensions_apply is defined
    - postgresql_extensions_apply.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0

- name: Warn when extensions are missing
  ansible.builtin.debug:
    msg: "Some extensions were not installed because they are missing in the image."
  when:
    - postgresql_extensions_ignore_missing | default(false)
    - postgresql_extensions_apply is defined
    - postgresql_extensions_apply.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0
