---
plex_package_name: plexmediaserver
plex_downloads_api_url: "https://plex.tv/api/downloads/5.json"

# Auto-detected from ansible_architecture unless overridden.
plex_linux_build_map:
  x86_64: linux-x86_64
  amd64: linux-x86_64
  aarch64: linux-aarch64
  arm64: linux-aarch64
  armv7l: linux-armv7neon

# Optional override: set directly to a .deb URL to pin a specific version.
plex_deb_url_override: ""

plex_data_dir: "/mnt/proxmox_swarm_data/plex"
plex_service_name: plexmediaserver

# Enable if the host/LXC has proper GPU device passthrough and groups.
plex_enable_hw_transcode: false
