---
# Manage users/databases by executing psql inside the PostgreSQL container

- name: Find PostgreSQL container by service label
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - -q
      - --filter
      - "label=com.docker.swarm.service.name={{ postgresql_docker_service_name }}"
  register: postgresql_container_by_label
  changed_when: false

- name: Find PostgreSQL container by name filter
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - -q
      - --filter
      - "name={{ postgresql_docker_service_name }}"
  register: postgresql_container_by_name
  changed_when: false
  when: postgresql_container_by_label.stdout | trim == ""

- name: Set PostgreSQL container ID
  ansible.builtin.set_fact:
    postgresql_container_id: >-
      {{ (postgresql_container_by_label.stdout | trim)
         if (postgresql_container_by_label.stdout | trim) != ""
         else (postgresql_container_by_name.stdout | trim) }}
  when: postgresql_container_by_label is defined
  no_log: true

- name: Fail if PostgreSQL container is not found
  ansible.builtin.fail:
    msg: "PostgreSQL container not found for service/name '{{ postgresql_docker_service_name }}'"
  when: postgresql_container_id | default('') | trim == ""

- name: Check PostgreSQL databases exist
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgresql_admin_password }}"
      - "{{ postgresql_container_id }}"
      - psql
      - -U
      - "{{ postgresql_admin_user }}"
      - -tAc
      - "SELECT 1 FROM pg_database WHERE datname='{{ item.db }}';"
  loop: "{{ postgresql_users_resolved }}"
  when: item.db is defined
  register: postgresql_db_checks
  changed_when: false
  no_log: true

- name: Create PostgreSQL databases
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgresql_admin_password }}"
      - "{{ postgresql_container_id }}"
      - psql
      - -U
      - "{{ postgresql_admin_user }}"
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "CREATE DATABASE \"{{ item.item.db }}\";"
  loop: "{{ postgresql_db_checks.results }}"
  when: item.stdout | trim == ""
  no_log: true

- name: Check PostgreSQL users exist
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgresql_admin_password }}"
      - "{{ postgresql_container_id }}"
      - psql
      - -U
      - "{{ postgresql_admin_user }}"
      - -tAc
      - "SELECT 1 FROM pg_roles WHERE rolname='{{ item.name }}';"
  loop: "{{ postgresql_users_resolved }}"
  register: postgresql_user_checks
  changed_when: false
  no_log: true

- name: Create PostgreSQL users
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgresql_admin_password }}"
      - "{{ postgresql_container_id }}"
      - psql
      - -U
      - "{{ postgresql_admin_user }}"
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "CREATE ROLE \"{{ item.item.name }}\" LOGIN PASSWORD '{{ item.item.password }}';"
  loop: "{{ postgresql_user_checks.results }}"
  when: item.stdout | trim == ""
  no_log: true

- name: Update PostgreSQL user passwords
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgresql_admin_password }}"
      - "{{ postgresql_container_id }}"
      - psql
      - -U
      - "{{ postgresql_admin_user }}"
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "ALTER ROLE \"{{ item.name }}\" PASSWORD '{{ item.password }}';"
  loop: "{{ postgresql_users_resolved }}"
  when: postgresql_update_passwords | default(true)
  changed_when: true
  no_log: true

- name: Grant ALL privileges to users on their databases
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgresql_admin_password }}"
      - "{{ postgresql_container_id }}"
      - psql
      - -U
      - "{{ postgresql_admin_user }}"
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "GRANT ALL PRIVILEGES ON DATABASE \"{{ item.db }}\" TO \"{{ item.name }}\";"
  loop: "{{ postgresql_users_resolved }}"
  when: item.db is defined
  changed_when: false
  no_log: true
