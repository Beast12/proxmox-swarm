services:
  server:
    image: ghcr.io/goauthentik/server:2025.10.3
    restart: unless-stopped
    user: "1000:1000"
    command: server
    networks:
      - postgres_network
      - services
      - proxy
    env_file:
      - /mnt/proxmox_swarm_data/env-files/authentik.env
    volumes:
      - /mnt/proxmox_swarm_data/authentik/media:/media
      - /mnt/proxmox_swarm_data/authentik/custom-templates:/templates
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "homepage.group=Infrastructure"
        - "homepage.name=Authentik"
        - "homepage.icon=authentik.png"
        - "homepage.href=https://sso.tuxito.be"
        - "homepage.description=SSO & Identity Provider"
        - "traefik.enable=true"
        - "traefik.docker.network=proxy"
        # Main router
        - "traefik.http.routers.authentik.rule=Host(`sso.tuxito.be`)"
        - "traefik.http.routers.authentik.entrypoints=websecure"
        - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
        - "traefik.http.services.authentik.loadbalancer.server.port=9000"
        # Outpost router (for embedded outpost endpoints)
        - "traefik.http.routers.authentik-outpost.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.tuxito.be`) && PathPrefix(`/outpost.goauthentik.io/`)"
        - "traefik.http.routers.authentik-outpost.entrypoints=websecure"
        - "traefik.http.routers.authentik-outpost.tls.certresolver=letsencrypt"
        - "traefik.http.routers.authentik-outpost.service=authentik"
  worker:
    image: ghcr.io/goauthentik/server:2025.10.3
    restart: unless-stopped
    command: worker
    networks:
      - postgres_network
      - services
    user: "1000:1000"
    env_file:
      - /mnt/proxmox_swarm_data/env-files/authentik.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/proxmox_swarm_data/authentik/media:/media
      - /mnt/proxmox_swarm_data/authentik/certs:/certs
      - /mnt/proxmox_swarm_data/authentik/custom-templates:/templates
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

networks:
  postgres_network:
    external: true
  services:
    external: true
  proxy:
    external: true
