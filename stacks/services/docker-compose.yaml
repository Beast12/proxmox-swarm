services:
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    user: "999:999"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    env_file:
      - /mnt/proxmox_swarm_data/env-files/services.env
    volumes:
      - /mnt/proxmox_swarm_data/services/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - /mnt/proxmox_swarm_data/services/redis/data:/data:rw
    networks:
      services:
        aliases:
          - valkey
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  gotify:
    image: gotify/server:latest
    restart: unless-stopped
    env_file:
      - /mnt/proxmox_swarm_data/env-files/services.env
    environment:
      - GOTIFY_DEFAULTUSER_NAME=${GOTIFY_ADMIN_USER:-admin}
      - GOTIFY_DEFAULTUSER_PASS=${GOTIFY_ADMIN_PASS}
      - TZ=Europe/Brussels
    volumes:
      - /mnt/proxmox_swarm_data/services/gotify/data:/app/data:rw
    networks:
      - services
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.gotify.rule=Host(`gotify.tuxito.be`)"
        - "traefik.http.routers.gotify.entrypoints=websecure"
        - "traefik.http.routers.gotify.tls.certresolver=letsencrypt"
        - "traefik.http.services.gotify.loadbalancer.server.port=80"

  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    user: "1000:1000"
    env_file:
      - /mnt/proxmox_swarm_data/env-files/services.env
    environment:
      - TZ=Europe/Brussels
    volumes:
      - /mnt/proxmox_swarm_data/services/ntfy/cache:/var/cache/ntfy:rw
      - /mnt/proxmox_swarm_data/services/ntfy/config:/etc/ntfy:ro
    networks:
      - services
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.ntfy.rule=Host(`ntfy.tuxito.be`)"
        - "traefik.http.routers.ntfy.entrypoints=websecure"
        - "traefik.http.routers.ntfy.tls.certresolver=letsencrypt"
        - "traefik.http.services.ntfy.loadbalancer.server.port=80"

  apprise:
    image: caronc/apprise:latest
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - /mnt/proxmox_swarm_data/env-files/services.env
    environment:
      - APPRISE_STATELESS_URLS=${APPRISE_STATELESS_URLS:-}
      - TZ=Europe/Brussels
    volumes:
      - /mnt/proxmox_swarm_data/services/apprise/config:/config:rw
    networks:
      - services
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.apprise.rule=Host(`apprise.tuxito.be`)"
        - "traefik.http.routers.apprise.entrypoints=websecure"
        - "traefik.http.routers.apprise.tls.certresolver=letsencrypt"
        - "traefik.http.services.apprise.loadbalancer.server.port=8000"

networks:
  services:
    external: true
