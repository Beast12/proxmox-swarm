version: "3.8"

networks:
  proxy:
    external: true
  productivity-nw:
    driver: overlay
  services:
    external: true

services:
  # FossFLOW - 3D diagrams
  fossflow:
    image: stnsmith/fossflow:latest
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    env_file:
      - /mnt/proxmox_swarm_data/env-files/fossflow.env
    volumes:
      - /mnt/proxmox_swarm_data/fossflow/data:/data/diagrams:rw
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.fossflow.rule=Host(`fossflow.tuxito.be`)"
        - "traefik.http.routers.fossflow.entrypoints=websecure"
        - "traefik.http.routers.fossflow.tls=true"
        - "traefik.http.routers.fossflow.tls.certresolver=letsencrypt"
        - "traefik.http.services.fossflow.loadbalancer.server.port=80"
        - "traefik.swarm.network=proxy"

  # Docmost - Document collaboration platform
  docmost:
    image: docmost/docmost:latest
    networks:
      - proxy
      - productivity-nw
      - services
    env_file:
      - /mnt/proxmox_swarm_data/env-files/docmost.env
    volumes:
      - /mnt/proxmox_swarm_data/docmost/data:/app/data/storage:rw
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.docmost.rule=Host(`docmost.tuxito.be`)"
        - "traefik.http.routers.docmost.entrypoints=websecure"
        - "traefik.http.routers.docmost.tls=true"
        - "traefik.http.routers.docmost.tls.certresolver=letsencrypt"
        - "traefik.http.services.docmost.loadbalancer.server.port=3000"
        - "traefik.swarm.network=proxy"
        - "homepage.group=Productivity Suite"
        - "homepage.name=Docmost"
        - "homepage.icon=mdi-file-document-multiple"
        - "homepage.href=https://docmost.tuxito.be"
        - "homepage.description=Document Collaboration"

  # Paperless-ngx - Document management system
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    networks:
      - proxy
      - productivity-nw
      - services
    env_file:
      - /mnt/proxmox_swarm_data/env-files/paperless.env
    volumes:
      - /mnt/proxmox_swarm_data/paperless/data:/usr/src/paperless/data:rw
      - /mnt/proxmox_swarm_data/paperless/media:/usr/src/paperless/media:rw
      - /mnt/proxmox_swarm_data/paperless/export:/usr/src/paperless/export:rw
      - /mnt/proxmox_swarm_data/paperless/consume:/usr/src/paperless/consume:rw
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.paperless.rule=Host(`paperless.tuxito.be`)"
        - "traefik.http.routers.paperless.entrypoints=websecure"
        - "traefik.http.routers.paperless.tls=true"
        - "traefik.http.routers.paperless.tls.certresolver=letsencrypt"
        - "traefik.http.services.paperless.loadbalancer.server.port=8000"
        - "traefik.swarm.network=proxy"
        - "homepage.group=Productivity Suite"
        - "homepage.name=Paperless-ngx"
        - "homepage.icon=mdi-file-pdf-box"
        - "homepage.href=https://paperless.tuxito.be"
        - "homepage.description=Document Management"

  # Penpot - Design and prototyping platform
  penpot-frontend:
    image: penpotapp/frontend:latest
    networks:
      - proxy
      - productivity-nw
      - services
    environment:
      - PENPOT_FLAGS=enable-registration enable-login-with-password disable-secure-session-cookies disable-email-verification disable-smtp
    volumes:
      - /mnt/proxmox_swarm_data/penpot/assets:/opt/data/assets:rw
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.penpot.rule=Host(`penpot.tuxito.be`)"
        - "traefik.http.routers.penpot.entrypoints=websecure"
        - "traefik.http.routers.penpot.tls=true"
        - "traefik.http.routers.penpot.tls.certresolver=letsencrypt"
        - "traefik.http.services.penpot.loadbalancer.server.port=8080"
        - "traefik.swarm.network=proxy"
        - "homepage.group=Productivity Suite"
        - "homepage.name=Penpot"
        - "homepage.icon=mdi-palette"
        - "homepage.href=https://penpot.tuxito.be"
        - "homepage.description=Design & Prototyping"

  penpot-backend:
    image: penpotapp/backend:latest
    networks:
      - productivity-nw
      - services
    env_file:
      - /mnt/proxmox_swarm_data/env-files/penpot-backend.env
    volumes:
      - /mnt/proxmox_swarm_data/penpot/assets:/opt/data/assets:rw
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  penpot-exporter:
    image: penpotapp/exporter:latest
    networks:
      - productivity-nw
      - services
    env_file:
      - /mnt/proxmox_swarm_data/env-files/penpot-exporter.env
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  # Shiori - Bookmark manager
  shiori:
    image: ghcr.io/go-shiori/shiori:latest
    networks:
      - proxy
    env_file:
      - /mnt/proxmox_swarm_data/env-files/shiori.env
    volumes:
      - /mnt/proxmox_swarm_data/shiori/data:/shiori-data:rw
    user: "1000:1000"
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.shiori.rule=Host(`bookmarks.tuxito.be`)"
        - "traefik.http.routers.shiori.entrypoints=websecure"
        - "traefik.http.routers.shiori.tls=true"
        - "traefik.http.routers.shiori.tls.certresolver=letsencrypt"
        - "traefik.http.services.shiori.loadbalancer.server.port=8080"
        - "traefik.swarm.network=proxy"
        - "homepage.group=Productivity Suite"
        - "homepage.name=Shiori"
        - "homepage.icon=mdi-bookmark"
        - "homepage.href=https://shiori.tuxito.be"
        - "homepage.description=Bookmark Manager"
  bitmappery:
    image: registry.tuxito.be/bitmappery:latest
    networks:
      - proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.bitmappery.rule=Host(`bitmappery.tuxito.be`)"
        - "traefik.http.routers.bitmappery.entrypoints=websecure"
        - "traefik.http.routers.bitmappery.tls=true"
        - "traefik.http.routers.bitmappery.tls.certresolver=letsencrypt"
        - "traefik.http.services.bitmappery.loadbalancer.server.port=5173"
        # Optional: Add middleware for security headers
        # - "traefik.http.routers.bitmappery.middlewares=secure-headers@file"
      placement:
        constraints:
          - node.role == worker # Adjust based on your cluster setup
    environment:
      - NODE_ENV=production
