services:
  traefik:
    image: traefik:v3.6

    networks:
      - proxy

    secrets:
      - dashboard_users_traefik

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host
    env_file:
      - /mnt/proxmox_swarm_data/env-files/traefik.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/proxmox_swarm_data/traefik/certs:/letsencrypt
      - /mnt/proxmox_swarm_data/traefik/config:/config
    command:
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.postgres.address=:5432"

      # Let's Encrypt with Cloudflare DNS Challenge
      - "--certificatesresolvers.letsencrypt.acme.email=koen@tuxito.be"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.disablepropagationcheck=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=10"

      # Uncomment for testing to avoid rate limits
      # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"

      # Swarm Provider
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.watch=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=proxy"

      # Dashboard
      - "--api.dashboard=true"

      # Logging
      - "--log.level=${LOG_LEVEL:-INFO}"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"

      # Metrics
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addRoutersLabels=true"

      # Load Balancing
      - "--ping=true"
      - "--ping.entrypoint=traefik"
      # Add file provider
      - "--providers.file.directory=/config"
      - "--providers.file.watch=true"

    deploy:
      mode: replicated
      replicas: 3
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

      labels:
        - "traefik.enable=true"

        # Dashboard Router
        - "traefik.http.routers.dashboard.rule=Host(`traefik.tuxito.be`)"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
        - "traefik.http.routers.dashboard.tls.domains[0].main=tuxito.be"
        - "traefik.http.routers.dashboard.tls.domains[0].sans=*.tuxito.be"

        # Dashboard Authentication - ADD THIS BACK
        - "traefik.http.middlewares.dashboard-auth.basicauth.usersfile=/run/secrets/dashboard_users_traefik"
        - "traefik.http.routers.dashboard.middlewares=dashboard-auth@swarm"

        # Required for Swarm - specify port for the API
        - "traefik.http.services.traefik.loadbalancer.server.port=8080"

networks:
  proxy:
    external: true

volumes:
  traefik-certificates:
    driver: local

secrets:
  dashboard_users_traefik:
    external: true
